#       --output ./data \
#       --export ./clean_dataset_export
# 
# Modify policy:
#   1. Edit thresholds above
#   2. Save this file
#   3. Re-run cleaning script
#   4. Compare results
# 
# Version control:
#   • Keep this file in git
#   • Tag versions: git tag cleaning-policy-v1.0
#   • Document changes in commit messages
# 
# Alternative policies:
#   • Conservative: uniqueness_threshold: 0.2, min_confidence: 0.9
#   • Very aggressive: uniqueness_threshold: 0.4, min_confidence: 0.6
#   • Quality-only: dedupe_by_cluster: false, focus on issues
# 
# Reproducibility:
#   • This file + Visual Layer dataset ID = deterministic cleaning
#   • Include in supplementary materials for papers
#   • Share with collaborators for consistent results

